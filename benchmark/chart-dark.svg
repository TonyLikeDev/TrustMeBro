  <text x="268.0" y="168" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">0%</text>
  <text x="250" y="212.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="end">... before any code was written</text>
  <path d="M262,190h262.7a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-262.7z" fill="#3987e5"><title>With tricklord: before any code was written 67%</title></path>
  <text x="534.6666666666667" y="202" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">67%</text>
  <text x="268.0" y="222" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">0%</text>
  <text x="250" y="266.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="end">LAYOUT.md kept up to date</text>
