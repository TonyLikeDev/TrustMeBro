<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Benchmark: agent with and without tricklord">
  <rect width="720" height="396" rx="8" fill="#1a1a19"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Does the agent keep the roadmap and layout up to date?</text>
  <text x="24" y="56" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Share of runs. Same 3 tasks (feature, bug fix, new module), fresh project every run.</text>
