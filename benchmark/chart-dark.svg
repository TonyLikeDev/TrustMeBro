  <line x1="462.0" y1="130" x2="462.0" y2="340" stroke="#2c2c2a" stroke-width="1"/>
  <text x="462.0" y="356" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">50%</text>
  <line x1="562.0" y1="130" x2="562.0" y2="340" stroke="#2c2c2a" stroke-width="1"/>
  <text x="562.0" y="356" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">75%</text>
  <line x1="662.0" y1="130" x2="662.0" y2="340" stroke="#2c2c2a" stroke-width="1"/>
  <text x="662.0" y="356" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">100%</text>
  <text x="250" y="158.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="end">Task put on the roadmap</text>
