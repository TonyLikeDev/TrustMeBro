  <text x="668.0" y="256" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">100%</text>
  <text x="268.0" y="276" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">0%</text>
  <text x="250" y="320.0" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="end">Task done correctly</text>
