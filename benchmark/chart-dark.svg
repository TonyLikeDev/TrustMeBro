  <text x="24" y="118" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Claude Code (6 runs per setup)</text>
  <line x1="262.0" y1="130" x2="262.0" y2="340" stroke="#383835" stroke-width="1"/>
  <text x="262.0" y="356" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">0%</text>
